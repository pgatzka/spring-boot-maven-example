spring:
  datasource:
    hikari:
      initialization-fail-timeout: -1
    url: jdbc:postgresql://localhost:5432/example_aot
    username: example_aot
    password: example_aot
  docker:
    compose:
      enabled: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false